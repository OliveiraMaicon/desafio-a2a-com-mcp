[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ponte-a2a-mcp"
version = "0.1.0"
description = "Transporte MCP stateless da Central de Salas"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]==1.3.1",
    "mcp==2.3.0",
    "pydantic==2.14.4",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["servidor-mcp"]
include = ["central_salas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["servidor-mcp"]
addopts = "-ra"
cache_dir = ".venv/pytest-cache"
